<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111a14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <title>Orofly — Painel Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f8f5; font-family: 'DM Sans', sans-serif; }
    select { appearance: none; -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f4f8f5; }
    ::-webkit-scrollbar-thumb { background: #d0e4d8; border-radius: 3px; }

    /* MOBILE */
    @media (max-width: 768px) {
      .sidebar-desktop { display: none !important; }
      .mobile-header { display: flex !important; }
      .mobile-sidebar { display: flex !important; }
      .main-content { padding: 0 !important; }
      .page-desktop { padding: 16px !important; }
      .filter-bar { padding: 12px !important; gap: 8px !important; }
      .filter-input { min-width: 0 !important; width: 100% !important; }
      .table-wrap { overflow-x: auto !important; }
      .users-layout { flex-direction: column !important; }
      .create-card { width: 100% !important; }
      .modal-desktop { border-radius: 0 !important; max-height: 100vh !important; height: 100vh !important; }
      .modal-grid { grid-template-columns: 1fr !important; }
      .cond-grid { grid-template-columns: 1fr 1fr !important; }
      .detail-row { flex-direction: column !important; gap: 12px !important; }
    }
    @media (min-width: 769px) {
      .mobile-header { display: none !important; }
      .mobile-sidebar { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
